name: CI
on: pull_request
jobs:
  guardrails:
    uses: blueworx-io/bluegroup_core_foundation/.github/workflows/ci-wordpress.yml@v1
    with:
      # Tests run against a disposable real WordPress the run provisions itself
      # (PHP + SQLite, no Docker). The DB-free PHP preview is still exercised:
      # playwright.config.js defines two projects, and the @preview specs — which
      # drive preview-only affordances — target the preview server it boots. So a
      # single run covers both harnesses, each with the specs it can actually serve.
      use_local_wordpress: true
      plugin_slug: blueworx-labs-clubhouse
      # Reports without failing. Not because the admin is behind — every screen
      # is on the design system now — but because the check reads the club's
      # own front end as an admin screen: it decides by looking for a "wrap"
      # class, and the front end's `ch-wrap` contains that word. Turning this on
      # would fail pull requests that only touch the front end, on rules that do
      # not apply to it. Tightening that belongs in the foundation, which every
      # project shares. docs/priorities.md has the full account and the other
      # two things it flags that have no action behind them.
      admin_ui_adherence: warn
      # Pin the check scripts to the same major as the workflow above. This
      # input defaults to `main`, so without it the v1 workflow would run
      # against whatever is on the foundation's main branch today.
      foundation_ref: v1
      # Identical to release.yml's list, deliberately: the check that runs on a
      # pull request and the build that runs on a tag must agree on what ships.
      exclude_paths: |
        # The vendored update checker ships whole, as upstream publishes it. Its
        # composer.json is the one file in it the zip check refuses — Composer
        # never runs on a site, so it is left out rather than deleted.
        /plugin-update-checker/composer.json

